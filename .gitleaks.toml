title = "Gitleaks"

[extend]
useDefault = true

# The anon key is public by design. It ships in every client bundle.
# Row Level Security is what protects the data.
# Paths only — not a JWT pattern. A service_role key looks almost the same
# and must still fail the scan in every other file.
[allowlist]
description = "Public Supabase anon key committed in the example env and the website prompt. RLS protects the data."
paths = [
  '''(^|[\\/])\.env\.example$''',
  '''(^|[\\/])CURSOR_PROMPT_WEBSITE\.md$''',
]
