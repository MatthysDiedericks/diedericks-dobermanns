<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>Hunter-King journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#111008; --surface:#1C1A0E; --gold:#C4A35A; --text:#F5F0E8; --subtle:#8a8378; --border:#3a3628; }
    html,body { margin:0; background:var(--bg); color:var(--text); font-family:Lato,sans-serif; }
    .phone { width:390px; min-height:844px; padding:20px 24px; }
    .eyebrow { font-family:Cinzel,serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
    h1 { font-family:Cinzel,serif; font-size:22px; font-weight:400; color:var(--gold); margin:8px 0 20px; }
    .btn { border:1px solid var(--gold); color:var(--gold); padding:8px 12px; display:inline-block; margin-bottom:24px; }
    .empty { border:1px dashed var(--border); padding:40px 16px; text-align:center; color:var(--subtle); }
  </style>
</head>
<body>
  <div class="phone">
    <p class="eyebrow">Training</p>
    <h1>Hunter-King — Journey</h1>
    <div class="btn">+ New entry</div>
    <div class="empty">
      <strong style="color:#F5F0E8">No journey entries yet</strong>
      <p>Standing at the field you can add a session, milestone, or note. Hunter-King has no training_logs rows today — none were invented for this check.</p>
    </div>
  </div>
</body>
</html>
