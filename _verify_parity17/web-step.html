<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cleo × Dharka plan step</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#111008; --surface:#1C1A0E; --gold:#C4A35A; --text:#F5F0E8; --subtle:#8a8378; --border:#3a3628; }
    html,body { margin:0; background:var(--bg); color:var(--text); font-family:Lato,sans-serif; }
    .desk { width:960px; min-height:720px; padding:32px 40px; }
    .eyebrow { font-family:Cinzel,serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
    h1 { font-family:Cinzel,serif; font-size:28px; font-weight:400; color:var(--gold); margin:8px 0 8px; }
    .sub { color:var(--subtle); margin:0 0 20px; }
    a { color:var(--gold); }
    .card { background:var(--surface); border:1px solid rgba(196,163,90,.2); padding:20px; }
    label { display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:14px 0 6px; }
    textarea, select { width:100%; background:#111008; border:1px solid var(--border); color:var(--text); padding:10px; font-family:Lato,sans-serif; }
    textarea { min-height:80px; }
    button { margin-top:18px; background:var(--gold); color:#111008; border:0; padding:10px 16px; font-family:Cinzel,serif; letter-spacing:.08em; text-transform:uppercase; }
    .note { font-size:12px; color:var(--subtle); margin-top:16px; }
  </style>
</head>
<body>
  <div class="desk">
    <p class="eyebrow">Breeding</p>
    <h1>Edit step</h1>
    <p class="sub">Line A — Dharka succession</p>
    <p><a href="#">← Line A — Dharka succession</a></p>
    <div class="card">
      <p class="eyebrow">Edit step</p>
      <label>What happens</label>
      <textarea>Carry out artificial insemination of Cleopatra to Dharka, and record the first mating date.</textarea>
      <label>Status</label>
      <select><option selected>In progress</option></select>
      <label>Kind of step</label>
      <select><option>Other</option></select>
      <button type="button">Save step</button>
      <p class="note">Real Cleo × Dharka plan 40e7e029-284f-42f8-a5d6-5d615197477a · step c941ac06-d048-4974-bcac-678a99317f43. Dedicated URL /admin/breeding/plans/:id/step.</p>
    </div>
  </div>
</body>
</html>
