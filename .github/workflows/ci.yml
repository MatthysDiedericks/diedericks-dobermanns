name: CI

# This repository contains the Expo mobile app only.
#
# The website lives in its own repository with its own remote, and this repo's
# .gitignore excludes `diedericksdobermann-web/`. A "TypeScript check
# (website)" job here therefore checked out a folder that does not exist and
# failed in ten seconds on every single push — which is most of the CI failure
# mail. The website's type check belongs in the website's own repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-mobile:
    name: TypeScript check (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diedericks-dobermanns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: diedericks-dobermanns/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
      - name: Gitleaks
        run: ./gitleaks detect --source . --verbose --redact --exit-code 1

  parity:
    name: Platform parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PARITY_GITHUB_TOKEN
        id: token
        env:
          PARITY_GITHUB_TOKEN: ${{ secrets.PARITY_GITHUB_TOKEN }}
        run: |
          if [ -z "$PARITY_GITHUB_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Platform parity skipped"
              echo ""
              echo "\`PARITY_GITHUB_TOKEN\` is not set. \`GITHUB_TOKEN\` cannot read the sibling private repo, so this gate does not run in CI."
              echo "Preflight carries the check locally until that secret is added."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PARITY_GITHUB_TOKEN is unset — skipping CI parity. Preflight is the gate until Matt adds the secret."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout website
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: MatthysDiedericks/diedericksdobermanns-web
          path: diedericksdobermann-web
          token: ${{ secrets.PARITY_GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: 20
      - name: Parity check
        if: steps.token.outputs.skip != 'true'
        run: npm run parity

  audit:
    name: npm audit (warning)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: diedericks-dobermanns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: diedericks-dobermanns/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
